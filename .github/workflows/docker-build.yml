name: Build and Publish Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Actions are pinned to full commit SHAs; see security-analysis.yml for why.

env:
  REGISTRY: ghcr.io
  # Use a lowercase version of the repository name
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26'
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  # Gate the publish on the Go suite, so a red build never reaches :latest.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-and-push:
    name: Build and Push
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Minify before the Docker build so Go embeds the optimized assets in the
      # binary. Files that are already minified remain byte-for-byte unchanged.
      - name: Minify JavaScript assets
        shell: bash
        run: |
          set -euo pipefail

          npm ci --ignore-scripts

          count=0
          while IFS= read -r -d '' file; do
            output="${file}.minified"
            before="$(wc -c < "$file")"

            ./node_modules/.bin/terser "$file" \
              --compress \
              --mangle \
              --output "$output"
            node --check "$output"

            after="$(wc -c < "$output")"
            if (( after >= before )); then
              echo "Minification did not reduce $file ($before -> $after bytes)" >&2
              exit 1
            fi

            mv "$output" "$file"
            echo "Minified $file ($before -> $after bytes)"
            count=$((count + 1))
          done < <(find internal/web/static/js -type f -name '*.js' ! -name '*.min.js' -print0)

          if (( count == 0 )); then
            echo "No unminified JavaScript assets found" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image_name
        run: echo "lowercase_image_name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase_image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Build the image into the local daemon first, so it can be scanned before
      # anything is published. The layers are cached, so the push build below
      # reuses them and costs almost nothing.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase_image_name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the publish on a CRITICAL or HIGH vulnerability, so :latest is never
      # pushed with a known one. ignore-unfixed keeps an un-patchable base-image
      # CVE from blocking every release until upstream ships a fix.
      - name: Scan image with Trivy (gate the publish)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase_image_name }}:scan
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
