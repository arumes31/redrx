{{define "title"}}Login - Redrx{{end}}
{{define "animation"}}dots{{end}}

{{define "content"}}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="fas fa-lock fa-3x text-warning"></i>
                </div>
                <h3 class="mb-4">Protected Link</h3>
                <p class="text-muted mb-4">Please enter the password to access <strong>{{upper (.Get "short_code")}}</strong></p>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <div class="mb-3">
                        <input class="form-control form-control-lg text-center" type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Unlock</button>
                </form>

                <div class="mt-4">
                    <a href="/" class="text-decoration-none text-light opacity-75">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
