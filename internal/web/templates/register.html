{{define "title"}}Register - Redrx{{end}}

{{define "content"}}
{{$form := .Get "form"}}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="text-center mb-4">Join Redrx</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" type="text" placeholder="Choose a username" value="{{$form.Username}}" autocomplete="username" required>
                    {{with $form.Errors.Get "username"}}<div class="text-danger small">{{.}}</div>{{end}}
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" placeholder="your@email.com" value="{{$form.Email}}" autocomplete="email" required>
                    {{with $form.Errors.Get "email"}}<div class="text-danger small">{{.}}</div>{{end}}
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
                    {{with $form.Errors.Get "password"}}<div class="text-danger small">{{.}}</div>{{end}}
                </div>
                <button type="submit" class="btn btn-shorten btn-lg w-100 mt-2">Register</button>
            </form>
            <div class="mt-3 text-center small">
                Already have an account? <a href="/login" class="text-info">Log In</a>
            </div>
        </div>
    </div>
</div>
{{end}}
