services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Required, with no default. A shipped constant would be a publicly known
      # signing key: session cookies are HMACed with it, so anyone could forge
      # one for any user id. `:?` makes compose refuse to start without it.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env, e.g. openssl rand -hex 32}
      - DATABASE_URL=postgresql://redrx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/redrx_db
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost:5000}
      - GEOIP_DB_PATH=/usr/share/GeoIP/GeoLite2-Country.mmdb
      - ANONYMIZE_LOGS=${ANONYMIZE_LOGS:-false}
      - RATELIMIT_STORAGE_URL=redis://redis:6379
      - RATELIMIT_DEFAULT=${RATELIMIT_DEFAULT:-200 per day;50 per hour}
      - RATELIMIT_CREATE=${RATELIMIT_CREATE:-10 per minute}
      - RATELIMIT_REDIRECT=${RATELIMIT_REDIRECT:-100 per minute}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - geoip_data:/usr/share/GeoIP
    # The shutdown path budgets 20s to drain plus 20s to release resources.
    stop_grace_period: 45s
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=redrx
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=redrx_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redrx -d redrx_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  geoip-updater:
    image: maxmindinc/geoipupdate
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=${MAXMIND_EDITION_IDS:-GeoLite2-Country}
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip_data:/usr/share/GeoIP
    restart: always

volumes:
  postgres_data:
  geoip_data:
